reader_profile: >
  Describe your role, what you are building, and what you are hiring,
  recruiting, or investing for in one to three specific sentences.

cadence: "three times a week"

watchlist:
  builders_and_researchers:
    - Andrej Karpathy
    - Simon Willison
    - Hamel Husain
  lab_leaders:
    - Demis Hassabis
    - Sam Altman
  companies_to_track:
    - Anysphere
    - Together AI

github_profile: "https://github.com/your-username"
interest_areas:
  - AI agents and coding-agent tooling
  - Your primary domain
  - Your secondary domain

never_recommend: []
exclude_topics:
  - AI opinion pieces with no new facts
  - Prompt-engineering listicles

part_b_categories:
  - Consulting & Strategy
  - Macro & Investment Trends
  - Capital Markets & M&A
  - Careers
  - The Established AI Stack

career_track:
  - Your target role

thesis_watch:
  enabled: false
  thesis: "One falsifiable claim you want to track"
  # The observable you believe moves first. A threshold is what makes the
  # thesis capable of losing; without one there is nothing to disconfirm.
  primary_tell:
    indicator: "What you watch, its current baseline, and the date of that baseline"
    threshold: "The move that would count as the thesis confirming"
  # Corroborating, but not decisive on their own.
  secondary_conditions:
    - "Indicator, current baseline, and date"
  # Where the same risk accumulates if the primary tell stays quiet:
  # off-balance-sheet structures, privately marked assets, lagged or
  # discretionary valuations, adjacent leverage.
  concealed_channel:
    - "Indicator, current baseline, and date"
  rule: "Report only movement since the previous run. Zero lines is valid."

dashboard:
  enabled: false
  # Claude Code: the private Artifact URL to update each run. Leave it empty
  # on the first run; the adapter publishes once, and you paste the URL here
  # so every later run updates the same link.
  artifact_url: ""

state:
  enabled: true
  # Default: ~/.ai-frontier-dispatch/events.jsonl
  # Set AI_FRONTIER_DISPATCH_HOME to keep state elsewhere.
  record_claims: "material claims only"
  record_source_health: true
